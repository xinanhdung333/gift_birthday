    <script>
        var VOCAL_START = 10.5;   // giây ca sĩ bắt đầu hát trong aud.mp3
        var tapTime = 0;
        function playAudio() {
            var audio = document.getElementById("myAudio");
            if (!tapTime) { tapTime = Date.now(); audio.currentTime = 0; }
            var pr = audio.play();
            if (pr && pr.catch) pr.catch(function(){});
        }
        // gọi cb khi ca sĩ bắt đầu hát (nếu nhạc không phát được thì canh theo đồng hồ)
        function waitForVocal(cb) {
            var a = document.getElementById("myAudio");
            (function check() {
                var elapsed = (Date.now() - tapTime) / 1000;
                if (a.currentTime >= VOCAL_START || a.ended ||
                    (a.paused && elapsed >= VOCAL_START) ||
                    elapsed >= VOCAL_START + 3) cb();   // mạng chậm, nhạc kẹt tải thì vẫn hiện chữ
                else setTimeout(check, 50);
            })();
        }
    </script>

    <!-- Hiệu ứng ảnh rơi -->
    <style>
      html, body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
      #stage { position: relative; margin: 10px auto 0; overflow: hidden; }
      #stage #wrap { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; }
      #text.mobile { position: absolute; left: 10px; z-index: 2; height: auto;
                     text-align: left; text-shadow: 0 1px 3px #000; }
      #text.mobile #code { margin-top: 0; font-size: 14px; line-height: 1.45; }
      /* nền phủ kín cả màn hình trên iPhone (Safari không hỗ trợ background-attachment: fixed) */
      html { background: #05024a; }
      body { background: none !important; min-height: 100vh; }
      body::before { content: ""; position: fixed; inset: 0; z-index: -1;
                     background: #05024a url('happybday-main/img2.png') center top / cover no-repeat; }
      #text.mobile .say { margin-left: 0; }

      .falling {
        position: fixed;
        top: 0;
        left: 0;
        width: 50px;
        height: 50px;
        object-fit: contain;
        animation: fall linear infinite, glow ease-in-out infinite alternate;
        opacity: 1;
        will-change: transform, opacity;
        pointer-events: none; /* không che click */
      }

      @keyframes fall {
        0%   { transform: translate3d(var(--start-x), -100px, 0) rotate(0deg); }
        100% { transform: translate3d(var(--end-x), 110vh, 0) rotate(360deg); }
      }

      /* chỉ đổi opacity cho nhẹ máy (animate filter rất giật trên iPhone) */
      @keyframes glow {
        from { opacity: 0.6; }
        to   { opacity: 1; }
      }
      @media (hover: hover) and (min-width: 760px) {
        .falling { filter: drop-shadow(0 0 10px rgba(255,150,200,0.9)); }
      }
    </style>

<body>

    <!-- Script cây + chữ -->
    <script>
    (function() {
        var canvas = $('#canvas');
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        // ---- Co giãn cho vừa màn hình (iPhone) ----
        var W = window.innerWidth, H = window.innerHeight;
        var PORTRAIT = W < 760 && H > W;   // điện thoại dựng dọc
        var s, tx = 0;
        if (PORTRAIT) {
            // cây thu nhỏ chiếm ~56% bên phải, chữ chạy bên trái
            s = 0.56 * W / 610;
            tx = W - 1100 * s;
            var sh = 680 * s;
            $('#text').addClass('mobile').appendTo('#stage')
                .css({ width: Math.round(W * 0.45) - 10, top: 0 });
            $('#stage').css({ width: W, height: sh, overflow: 'visible',
                              marginTop: Math.max(10, Math.round((H - sh) / 2 - 40)) });
        } else {
            s = Math.min(1, W / 1100, (H - 10) / 680);
            $('#stage').css({ width: 1100 * s, height: 680 * s });
        }
        $('#wrap').css('transform', 'translate(' + tx + 'px,0) scale(' + s + ')');

        var width = canvas.width();
        var height = canvas.height();        
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = { /* giữ nguyên config cây */ 
            seed: { x: width / 2 - 20, color: "rgb(190, 26, 37)", scale: 2 },
            branch: [ [535, 680, 570, 250, 500, 200, 30, 100, []] ],
            bloom: { num: 700, width: 1080, height: 650 },
            footer: { width: 1200, height: 5, speed: 10 }
        };

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;

        canvas.click(function(e) {
            var offset = canvas.offset(), x, y;
            x = (e.pageX - offset.left) / s;
            y = (e.pageY - offset.top) / s;
            if (seed.hover(x, y)) {
                playAudio();   // nhạc bắt đầu đúng lúc chạm vào tim
                start();
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e) {
            var offset = canvas.offset(), x, y;
            x = (e.pageX - offset.left) / s;
            y = (e.pageY - offset.top) / s;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        // ---- Chạy hiệu ứng theo đồng hồ thật: máy chậm (iPhone) tự gộp nhiều bước
        //      vào 1 khung hình nên tổng thời gian giống hệt máy tính ----
        var STEP_MS = 11;
        function phase(step, done) {          // step() trả về false khi xong
            var last = performance.now(), acc = STEP_MS;
            function frame(now) {
                acc += Math.min(now - last, 120); last = now;
                var n = 0;
                while (acc >= STEP_MS && n < 12) {
                    if (step() === false) { done(); return; }
                    acc -= STEP_MS; n++;
                }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        seed.draw();
        function start() {
            phase(function () {
                if (seed.canScale()) { seed.scale(0.95); return; }
                if (seed.canMove())  { seed.move(0, 2); foot.draw(); return; }
                return false;
            }, function () {
                phase(function () {
                    tree.grow(); return tree.canGrow();
                }, function () {
                    phase(function () {
                        tree.flower(2); return tree.canFlower();
                    }, function () {
                        tree.snapshot("p1", 240, 0, 610, 680);
                        phase(function () {
                            var more = tree.move("p1", 500, 0); foot.draw(); return more;
                        }, function () {
                            waitForVocal(function () { $("#code").show().typewriter(); });
                        });
                    });
                });
            });
        }
    })();
    </script>
